<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ace Awards 2026 — Written in the Stars</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Great+Vibes&family=Montserrat:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="velvet-backdrop" aria-hidden="true"></div>
  <canvas id="particles-canvas" aria-hidden="true"></canvas>

  <main class="scene">
    <section class="stage" aria-label="Interactive Invitation">
      <p class="top-calligraphy">Written in the Stars</p>

      <div
        id="envelope-wrapper"
        class="envelope-wrapper"
        role="button"
        tabindex="0"
        aria-label="Open Ace Awards 2026 invitation"
        aria-expanded="false"
      >
        <div class="envelope">
          <div class="envelope-back"></div>

          <article class="invitation-card" aria-label="Ace Awards 2026 Invitation Card">
            <img
              id="card-artwork"
              class="card-artwork"
              src="./ASSETS/ace-awards-card.jpg"
              alt="Ace Awards 2026 Written in the Stars Invitation"
            />
            <div id="card-fallback" class="card-fallback">
              <h1 class="fallback-title">Ace Awards 2026</h1>
              <p class="fallback-sub">Written in the Stars</p>
              <p class="fallback-note">
                Make sure your image exists at:
                <code>ASSETS/ace-awards-card.jpg</code>
              </p>
            </div>
          </article>

          <div class="envelope-pocket"></div>
          <div class="envelope-flap"></div>

          <div class="wax-seal" aria-hidden="true">
            <div class="seal-rim">
              <span class="monogram">AA</span>
            </div>
          </div>
        </div>
      </div>

      <div class="controls">
        <p id="prompt-text" class="prompt-text">Tap or press Enter to open</p>
        <button id="reset-btn" class="reset-btn" type="button" hidden>
          Close Invitation
        </button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
